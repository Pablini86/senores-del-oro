<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gracias por tu compra — Señores del Oro</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="assets/style.css?v=20261118b">
<script src="assets/pixel.js?v=20261118b"></script>
<link rel="apple-touch-icon" href="assets/favicon.png">
<link rel="icon" type="image/png" href="assets/favicon.png">
<style>
.thanks-wrap {
  max-width: 640px; margin: 0 auto;
  padding: 180px 24px 120px; text-align: center;
}
.thanks-wrap h1 {
  font-family: 'Cormorant Garamond', serif; font-weight: 300;
  font-size: clamp(34px, 5vw, 54px); color: var(--champagne); line-height: 1.1;
  margin-bottom: 18px;
}
.thanks-wrap p { font-size: 14px; line-height: 1.9; color: rgba(232,224,204,.65); margin-bottom: 12px; }
.thanks-wrap strong { color: rgba(232,224,204,.92); font-weight: 400; }
.thanks-total { font-family: 'Cormorant Garamond', serif; font-size: 28px; color: var(--oro); margin: 18px 0 26px; }
.thanks-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 30px; }
.thanks-actions a {
  display: inline-block; padding: 14px 26px; font-size: 11px; letter-spacing: 2px;
  text-transform: uppercase; text-decoration: none; border: 1px solid var(--oro); color: var(--oro);
}
.thanks-actions a.primary { background: var(--oro); color: var(--negro); }
</style>
</head>
<body>

<div id="site-header"></div>

<main class="thanks-wrap" id="thanks">
  <h1>Confirmando tu pago…</h1>
  <p>Un momento, por favor.</p>
</main>

<div id="site-footer"></div>

<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/config.js?v=20261118b"></script>
<script src="assets/db.js?v=20261118b"></script>
<script src="assets/cart.js?v=20261118b"></script>
<script src="assets/partials.js?v=20261118b"></script>
<script>
mountLayout({ navVariant: 'coleccion' });

(async function () {
  const box = document.getElementById('thanks');
  const id = new URLSearchParams(location.search).get('session_id') || '';
  const waLink = `https://wa.me/${SITE_WA_NUMBER}`;
  const money = n => '$' + Number(n).toLocaleString('es-MX', { maximumFractionDigits: 2 });

  function show(html) { box.innerHTML = html; }
  const actions = `
    <div class="thanks-actions">
      <a class="primary" href="coleccion.html">Seguir viendo</a>
      <a href="${waLink}" target="_blank" rel="noopener">Escríbenos por WhatsApp</a>
    </div>`;

  if (!CHECKOUT_ENDPOINT || !/^cs_(test|live)_/.test(id)) {
    show(`<h1>Gracias</h1><p>Si hiciste un pago y tienes dudas, escríbenos por WhatsApp.</p>${actions}`);
    return;
  }

  let s = null;
  try {
    const url = CHECKOUT_ENDPOINT.replace(/\/checkout$/, '/session') + '?id=' + encodeURIComponent(id);
    const r = await fetch(url);
    if (r.ok) s = await r.json();
  } catch (_) { /* red caída: mensaje genérico abajo */ }

  if (s && s.payment_status === 'paid') {
    // Vaciar carrito y contar la compra UNA sola vez por sesión de pago
    const DONE_KEY = 'sdo_paid_' + s.id;
    let first = true;
    try { first = !localStorage.getItem(DONE_KEY); localStorage.setItem(DONE_KEY, '1'); } catch (_) {}
    if (first) {
      // Quitar del carrito SÓLO lo que se pagó (con "Comprar ahora" el carrito puede tener otras piezas)
      (s.skus || []).forEach(sku => Cart.remove(sku));
      if (typeof window.fbq === 'function') {
        fbq('track', 'Purchase', {
          value: s.amount_total, currency: s.currency,
          content_ids: s.skus, content_type: 'product',
        }, { eventID: s.id });
      }
    }
    show(`
      <h1>Gracias por tu compra</h1>
      <p class="thanks-total">${money(s.amount_total)} ${s.currency}</p>
      <p>Tu pago quedó confirmado. Te llegará un recibo a tu correo.</p>
      <p>Te escribimos por WhatsApp para confirmar tu envío y mandarte la guía de rastreo.</p>
      ${actions}`);
    return;
  }

  if (s && s.status === 'complete') {
    // Pago iniciado pero aún no acreditado (p. ej. pago en efectivo pendiente)
    show(`
      <h1>Tu pedido está registrado</h1>
      <p>Tu pago todavía está <strong>pendiente</strong>. En cuanto se acredite te confirmamos por WhatsApp.</p>
      ${actions}`);
    return;
  }

  show(`
    <h1>No pudimos confirmar el pago</h1>
    <p>Si se hizo un cargo a tu tarjeta, escríbenos por WhatsApp y lo revisamos. Tu carrito sigue guardado.</p>
    ${actions}`);
})();
</script>
</body>
</html>
